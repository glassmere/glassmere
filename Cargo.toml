[workspace]
resolver = "2"
members = [
    "crates/seaglass",
    "crates/seaglass-core",
    "crates/seaglass-scene",
    "crates/seaglass-text",
    "crates/seaglass-render-wgpu",
    "crates/seaglass-render-cpu",
    "crates/seaglass-winit",
    "crates/seaglass-testing",
    "crates/seaglass-devtools",
    "crates/seaglass-syntax",
    "crates/seaglass-image",
    "crates/seaglass-derive",
    "crates/seaglass-fluent",
    "crates/seaglass-icu",
    "crates/seaglass-dev",
    "crates/seaglass-win32",
    "crates/seaglass-allocations",
    # A widget built the way a third party would build one.
    "examples/dial-widget",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
readme = "README.md"
publish = false

[workspace.dependencies]
seaglass-core = { path = "crates/seaglass-core" }
seaglass-scene = { path = "crates/seaglass-scene" }
seaglass-text = { path = "crates/seaglass-text" }
seaglass-render-cpu = { path = "crates/seaglass-render-cpu" }
seaglass-render-wgpu = { path = "crates/seaglass-render-wgpu" }
seaglass-winit = { path = "crates/seaglass-winit" }
seaglass-testing = { path = "crates/seaglass-testing" }
seaglass-devtools = { path = "crates/seaglass-devtools" }
seaglass-syntax = { path = "crates/seaglass-syntax" }
seaglass-image = { path = "crates/seaglass-image" }
seaglass-derive = { path = "crates/seaglass-derive" }
seaglass-fluent = { path = "crates/seaglass-fluent" }
seaglass-icu = { path = "crates/seaglass-icu" }
seaglass-win32 = { path = "crates/seaglass-win32" }
bitflags = "2.13"
ropey = "1.6"
serde = { version = "1.0.229", features = ["derive"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
taffy = { version = "0.10.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
wgpu = "29.0.4"
winit = "0.30.13"
# The version glyphon uses, so that both share one font system type.
cosmic-text = "0.18"
glyphon = "0.11.0"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
accesskit = "0.24.1"
accesskit_winit = "0.32.2"
unicode-segmentation = "1.13"
arboard = { version = "3.6.1", default-features = false }
sys-locale = "0.3.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 1

# An optimized build that can be profiled without replacing a running release app.
[profile.profiling]
inherits = "release"
