[workspace]
resolver = "2"
members = [
    "crates/glassmere",
    "crates/glassmere-core",
    "crates/glassmere-scene",
    "crates/glassmere-text",
    "crates/glassmere-render-wgpu",
    "crates/glassmere-render-cpu",
    "crates/glassmere-winit",
    "crates/glassmere-testing",
    "crates/glassmere-devtools",
    "crates/glassmere-syntax",
    "crates/glassmere-image",
    "crates/glassmere-derive",
    "crates/glassmere-fluent",
    "crates/glassmere-icu",
    "crates/glassmere-dev",
    "crates/glassmere-win32",
    "crates/glassmere-allocations",
    "examples",
    # A widget built the way a third party would build one.
    "examples/dial-widget",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
readme = "README.md"
publish = false

[workspace.dependencies]
glassmere-core = { path = "crates/glassmere-core" }
glassmere-scene = { path = "crates/glassmere-scene" }
glassmere-text = { path = "crates/glassmere-text" }
glassmere-render-cpu = { path = "crates/glassmere-render-cpu" }
glassmere-render-wgpu = { path = "crates/glassmere-render-wgpu" }
glassmere-winit = { path = "crates/glassmere-winit" }
glassmere-testing = { path = "crates/glassmere-testing" }
glassmere-devtools = { path = "crates/glassmere-devtools" }
glassmere-syntax = { path = "crates/glassmere-syntax" }
glassmere-image = { path = "crates/glassmere-image" }
glassmere-derive = { path = "crates/glassmere-derive" }
glassmere-fluent = { path = "crates/glassmere-fluent" }
glassmere-icu = { path = "crates/glassmere-icu" }
glassmere-win32 = { path = "crates/glassmere-win32" }
bitflags = "2.13"
ropey = "1.6"
serde = { version = "1.0.229", features = ["derive"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
taffy = { version = "0.10.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
wgpu = "29.0.4"
winit = "0.30.13"
# The version glyphon uses, so that both share one font system type.
cosmic-text = "0.18"
glyphon = "0.11.0"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
accesskit = "0.24.1"
accesskit_winit = "0.32.2"
unicode-segmentation = "1.13"
arboard = { version = "3.6.1", default-features = false }
sys-locale = "0.3.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 1

# An optimized build that can be profiled without replacing a running release app.
[profile.profiling]
inherits = "release"
