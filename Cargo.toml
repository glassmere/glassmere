[workspace]
resolver = "2"
# Built for a bare-metal target, with its own lock file.
exclude = ["examples/embedded-firmware"]
members = [
    "crates/glassmere",
    "crates/glassmere-core",
    "crates/glassmere-scene",
    "crates/glassmere-text",
    "crates/glassmere-render-wgpu",
    "crates/glassmere-render-cpu",
    "crates/glassmere-embedded",
    "crates/glassmere-winit",
    "crates/glassmere-testing",
    "crates/glassmere-devtools",
    "crates/glassmere-syntax",
    "crates/glassmere-image",
    "crates/glassmere-derive",
    "crates/glassmere-fluent",
    "crates/glassmere-icu",
    "crates/glassmere-dev",
    "crates/glassmere-win32",
    "crates/glassmere-allocations",
    "crates/glassmere-bench",
    "crates/glassmere-markup",
    "crates/glassmere-designer",
    "examples",
    # A widget built the way a third party would build one.
    "examples/dial-widget",
]

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/glassmere/glassmere"

[workspace.dependencies]
# `default-features = false` lets the two kernel crates build without `std`; each member asks for it.
glassmere = { path = "crates/glassmere", version = "0.1.8", default-features = false }
glassmere-core = { path = "crates/glassmere-core", version = "0.1.8", default-features = false }
glassmere-scene = { path = "crates/glassmere-scene", version = "0.1.8", default-features = false }
glassmere-text = { path = "crates/glassmere-text", version = "0.1.8" }
glassmere-render-cpu = { path = "crates/glassmere-render-cpu", version = "0.1.8" }
glassmere-embedded = { path = "crates/glassmere-embedded", version = "0.1.8" }
glassmere-render-wgpu = { path = "crates/glassmere-render-wgpu", version = "0.1.8" }
glassmere-winit = { path = "crates/glassmere-winit", version = "0.1.8" }
glassmere-testing = { path = "crates/glassmere-testing", version = "0.1.8" }
glassmere-devtools = { path = "crates/glassmere-devtools", version = "0.1.8" }
glassmere-syntax = { path = "crates/glassmere-syntax", version = "0.1.8" }
glassmere-image = { path = "crates/glassmere-image", version = "0.1.8" }
glassmere-derive = { path = "crates/glassmere-derive", version = "0.1.8" }
glassmere-fluent = { path = "crates/glassmere-fluent", version = "0.1.8" }
glassmere-icu = { path = "crates/glassmere-icu", version = "0.1.8" }
glassmere-win32 = { path = "crates/glassmere-win32", version = "0.1.8" }
glassmere-markup = { path = "crates/glassmere-markup", version = "0.1.8" }
bitflags = "2.13"
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
libm = "0.2"
ropey = "1.6"
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
tracing = { version = "0.1.44", default-features = false }
taffy = { version = "0.10.1", default-features = false, features = ["taffy_tree", "flexbox", "grid"] }
wgpu = "29.0.4"
winit = "0.30.13"
# The version glyphon uses, so that both share one font system type.
cosmic-text = "0.18"
glyphon = "0.11.0"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
accesskit = "0.24.1"
accesskit_winit = "0.32.2"
unicode-segmentation = "1.13"
arboard = { version = "3.6.1", default-features = false }
sys-locale = "0.3.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = 1

# An optimized build that can be profiled without replacing a running release app.
[profile.profiling]
inherits = "release"
# Names for a sampling profiler to put on the stacks it reads.
debug = "line-tables-only"
