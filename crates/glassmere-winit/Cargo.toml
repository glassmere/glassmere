[package]
name = "glassmere-winit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Event-driven desktop host for glassmere: logical coordinates, a wgpu surface, and native windows."
keywords = ["gui", "winit", "wgpu", "window", "desktop"]
categories = ["gui", "graphics"]

[package.metadata.docs.rs]
features = ["diagnostics", "images"]

[features]
diagnostics = []
# Native file dialogs, notifications, menu bars and tray icons. Off by
# default: each is a dependency an application may not want in its binary.
platform = ["dep:rfd", "dep:notify-rust", "dep:muda", "dep:tray-icon", "glassmere-win32/menu"]
# Decoding for `Ui::image_file`; without it image files report an error.
images = ["dep:glassmere-image", "arboard/image-data"]

[dependencies]
glassmere-core.workspace = true
glassmere-scene.workspace = true
glassmere-render-wgpu.workspace = true
glassmere-render-cpu.workspace = true
glassmere-devtools.workspace = true
glassmere-image = { workspace = true, optional = true }
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true
# Hands the CPU renderer's pixels to a window when there is no usable adapter.
softbuffer = "0.4"
pollster.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
arboard.workspace = true
sys-locale.workspace = true
rfd = { version = "0.17.2", optional = true }
notify-rust = { version = "4.18.2", optional = true }
# muda's and tray-icon's default features (GTK 3, libxdo, libappindicator)
# only apply to Linux, which uses KSNI instead: see below.
muda = { version = "0.21", optional = true, default-features = false }
tray-icon = { version = "0.26", optional = true, default-features = false }

# On Linux and the BSDs the tray is a StatusNotifierItem served over D-Bus
# (KSNI), with its menu sent as a snapshot of the muda menu. That needs no GTK
# main loop and no libappindicator or libxdo, which an application could not
# count on finding: a missing appindicator library made the default backend
# panic. It is declared for these targets only, because the snapshot feature
# changes how muda shares menu state on every platform.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
tray-icon = { version = "0.26", optional = true, default-features = false, features = ["ksni"] }

# Outgoing file drags. On Linux the crate wants a GTK window, which winit is not.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1"

# The clipboard talks to Wayland directly when there is a Wayland session.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }

# Where the maximize button of a title bar the application draws is, which
# only a window procedure can answer.
[target.'cfg(windows)'.dependencies]
glassmere-win32.workspace = true

[lints]
workspace = true
