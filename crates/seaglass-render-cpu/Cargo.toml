[package]
name = "seaglass-render-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "CPU renderer for seaglass scenes: screenshots, export, and a desktop fallback without a GPU."

[dependencies]
seaglass-scene.workspace = true
seaglass-text.workspace = true
# The version resvg uses, so the tree holds one rasterizer.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
seaglass-core.workspace = true
seaglass-render-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true

[lints]
workspace = true
