[package]
name = "glassmere-win32"
description = "The one crate with unsafe code: what Windows will only tell a window procedure."
keywords = ["gui", "windows", "win32", "snap-layouts"]
categories = ["os::windows-apis", "gui"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# A window's menu bar, which muda attaches with unsafe calls.
menu = ["dep:muda"]

[target.'cfg(windows)'.dependencies]
muda = { version = "0.21", optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Windows only: elsewhere the crate is empty.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

# Deliberately not `workspace = true`: this crate exists to hold the unsafe
# the rest of the workspace forbids. Everything here is one window procedure
# and the menu bar.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
