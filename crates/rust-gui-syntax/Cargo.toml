[package]
name = "rust-gui-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Syntax highlighting for rust-gui's code editor, using syntect's bundled grammars and themes."

[dependencies]
rust-gui-core.workspace = true
rust-gui-scene.workspace = true
# Pure-Rust regex engine: no C toolchain needed to build.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[lints]
workspace = true
