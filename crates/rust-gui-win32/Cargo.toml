[package]
name = "rust-gui-win32"
description = "The one crate with unsafe code: what Windows will only tell a window procedure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Deliberately not `workspace = true`: this crate exists to hold the unsafe
# the rest of the workspace forbids. Everything here is one window procedure.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
