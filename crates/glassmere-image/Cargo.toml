[package]
name = "glassmere-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "PNG, JPEG, WebP, GIF and SVG decoding with a background loader, for glassmere."
keywords = ["gui", "image", "svg", "decoding"]
categories = ["multimedia::images", "gui"]

[dependencies]
glassmere-scene.workspace = true
# Only the decoders the framework promises; no encoders, no parallel decoding.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[lints]
workspace = true
