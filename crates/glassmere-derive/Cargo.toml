[package]
name = "glassmere-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "#[derive(Properties)] for glassmere: property grid rows generated from a struct's fields."
keywords = ["gui", "derive", "properties", "proc-macro", "property-grid"]
categories = ["development-tools::procedural-macro-helpers", "gui"]

[lib]
proc-macro = true

[dependencies]
# Only what a derive needs: no `full` syntax tree, no visitors.
syn = { version = "3.0", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
quote = { version = "1.0", default-features = false, features = ["proc-macro"] }
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }
# Reads the default-locale catalog that `tr!` checks keys and arguments against.
fluent-syntax = "0.12.0"
# `style_sheet!` parses with the framework's own parser rather than a second
# one that would drift from it.
glassmere-core.workspace = true

[lints]
workspace = true
