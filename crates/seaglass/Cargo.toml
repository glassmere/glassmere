[package]
name = "seaglass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme.workspace = true
description = "Immediate-style GUI framework over a retained, incremental UI kernel, with widgets, layout, text, theming and accessibility."
keywords = ["gui", "ui", "immediate-mode", "widgets", "wgpu"]
categories = ["gui", "graphics"]

# `tr!` checks keys and arguments against this catalog while compiling.
[package.metadata.seaglass]
messages = "examples/locales/en.ftl"

[features]
default = ["desktop", "syntax", "images", "derive", "fluent", "regex"]
desktop = ["dep:seaglass-winit", "dep:seaglass-render-wgpu"]
diagnostics = ["desktop", "seaglass-winit/diagnostics"]
# `seaglass::syntax`: syntect highlighting for the code editor.
syntax = ["dep:seaglass-syntax"]
# `seaglass::image`: PNG, JPEG, WebP, GIF and SVG decoding, and `Ui::image_file` on the desktop.
images = ["dep:seaglass-image", "seaglass-winit?/images"]
# `seaglass::icu`: CLDR numbers, dates and times through ICU4X. Not on by
# default: a large dependency tree, and about a megabyte of compiled data.
icu = ["dep:seaglass-icu"]
# `seaglass::fluent`: Fluent catalogs for `Ui::tr`.
fluent = ["dep:seaglass-fluent"]
# `#[derive(Properties)]` for property grids.
derive = ["dep:seaglass-derive"]
# Regular expressions in the code editor's find bar.
regex = ["seaglass-core/regex"]
# Native file dialogs, notifications, application menus and tray icons. Not
# on by default: four dependencies an application may not want.
platform = ["desktop", "seaglass-winit/platform"]
# Serialize and Deserialize for `DockLayout`.
serde = ["seaglass-core/serde"]

[dependencies]
seaglass-core.workspace = true
seaglass-scene.workspace = true
seaglass-devtools.workspace = true
seaglass-render-cpu.workspace = true
seaglass-winit = { workspace = true, optional = true }
seaglass-render-wgpu = { workspace = true, optional = true }
seaglass-syntax = { workspace = true, optional = true }
seaglass-image = { workspace = true, optional = true }
seaglass-derive = { workspace = true, optional = true }
seaglass-fluent = { workspace = true, optional = true }
seaglass-icu = { workspace = true, optional = true }

[[example]]
name = "counter"
required-features = ["desktop"]

[[example]]
name = "platform"
required-features = ["platform"]

[[example]]
name = "workbench"
required-features = ["desktop"]

[[example]]
name = "controls"
required-features = ["desktop"]

[[example]]
name = "application"
required-features = ["desktop"]

[[example]]
name = "theming"
required-features = ["desktop"]

[[example]]
name = "layout"
required-features = ["desktop"]

[[example]]
name = "dialogs"
required-features = ["desktop"]

[[example]]
name = "panes"
required-features = ["desktop"]

[[example]]
name = "animations"
required-features = ["desktop"]

[[example]]
name = "docking"
required-features = ["desktop"]

[[example]]
name = "editor"
required-features = ["desktop", "syntax"]

[[example]]
name = "richtext"
required-features = ["desktop", "syntax"]

[[example]]
name = "localization"
required-features = ["desktop", "fluent"]

[[example]]
name = "grid"
required-features = ["desktop"]

[[example]]
name = "properties"
required-features = ["desktop", "derive"]

[[example]]
name = "images"
required-features = ["desktop", "images"]

[dev-dependencies]
seaglass-testing.workspace = true
# Reads the crates' own sources for the public-surface snapshot.
syn = { version = "2.0", features = ["full", "parsing", "printing"] }
quote = "1.0"

[lints]
workspace = true
