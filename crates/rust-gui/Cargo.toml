[package]
name = "rust-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `tr!` checks keys and arguments against this catalog while compiling.
[package.metadata.rust-gui]
messages = "examples/locales/en.ftl"

[features]
default = ["desktop", "syntax", "images", "derive", "fluent", "regex"]
desktop = ["dep:rust-gui-winit", "dep:rust-gui-render-wgpu"]
diagnostics = ["desktop", "rust-gui-winit/diagnostics"]
# `rust_gui::syntax`: syntect highlighting for the code editor.
syntax = ["dep:rust-gui-syntax"]
# `rust_gui::image`: PNG, JPEG, WebP, GIF and SVG decoding, and `Ui::image_file` on the desktop.
images = ["dep:rust-gui-image", "rust-gui-winit?/images"]
# `rust_gui::icu`: CLDR numbers, dates and times through ICU4X. Not on by
# default: a large dependency tree, and about a megabyte of compiled data.
icu = ["dep:rust-gui-icu"]
# `rust_gui::fluent`: Fluent catalogs for `Ui::tr`.
fluent = ["dep:rust-gui-fluent"]
# `#[derive(Properties)]` for property grids.
derive = ["dep:rust-gui-derive"]
# Regular expressions in the code editor's find bar.
regex = ["rust-gui-core/regex"]
# Native file dialogs, notifications, application menus and tray icons. Not
# on by default: four dependencies an application may not want.
platform = ["desktop", "rust-gui-winit/platform"]
# Serialize and Deserialize for `DockLayout`.
serde = ["rust-gui-core/serde"]

[dependencies]
rust-gui-core.workspace = true
rust-gui-scene.workspace = true
rust-gui-devtools.workspace = true
rust-gui-render-cpu.workspace = true
rust-gui-winit = { workspace = true, optional = true }
rust-gui-render-wgpu = { workspace = true, optional = true }
rust-gui-syntax = { workspace = true, optional = true }
rust-gui-image = { workspace = true, optional = true }
rust-gui-derive = { workspace = true, optional = true }
rust-gui-fluent = { workspace = true, optional = true }
rust-gui-icu = { workspace = true, optional = true }

[[example]]
name = "counter"
required-features = ["desktop"]

[[example]]
name = "platform"
required-features = ["platform"]

[[example]]
name = "workbench"
required-features = ["desktop"]

[[example]]
name = "controls"
required-features = ["desktop"]

[[example]]
name = "application"
required-features = ["desktop"]

[[example]]
name = "theming"
required-features = ["desktop"]

[[example]]
name = "layout"
required-features = ["desktop"]

[[example]]
name = "dialogs"
required-features = ["desktop"]

[[example]]
name = "panes"
required-features = ["desktop"]

[[example]]
name = "animations"
required-features = ["desktop"]

[[example]]
name = "docking"
required-features = ["desktop"]

[[example]]
name = "editor"
required-features = ["desktop", "syntax"]

[[example]]
name = "richtext"
required-features = ["desktop", "syntax"]

[[example]]
name = "localization"
required-features = ["desktop", "fluent"]

[[example]]
name = "grid"
required-features = ["desktop"]

[[example]]
name = "properties"
required-features = ["desktop", "derive"]

[[example]]
name = "images"
required-features = ["desktop", "images"]

[dev-dependencies]
rust-gui-testing.workspace = true
# Reads the crates' own sources for the public-surface snapshot.
syn = { version = "2.0", features = ["full", "parsing", "printing"] }
quote = "1.0"

[lints]
workspace = true
