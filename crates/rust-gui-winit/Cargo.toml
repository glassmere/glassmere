[package]
name = "rust-gui-winit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
diagnostics = []
# Decoding for `Ui::image_file`; without it image files report an error.
images = ["dep:rust-gui-image"]

[dependencies]
rust-gui-core.workspace = true
rust-gui-scene.workspace = true
rust-gui-render-wgpu.workspace = true
rust-gui-render-cpu.workspace = true
rust-gui-devtools.workspace = true
rust-gui-image = { workspace = true, optional = true }
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true
# Hands the CPU renderer's pixels to a window when there is no usable adapter.
softbuffer = "0.4"
pollster.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
arboard.workspace = true
sys-locale.workspace = true

# Outgoing file drags. On Linux the crate wants a GTK window, which winit is not.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1"

[lints]
workspace = true
