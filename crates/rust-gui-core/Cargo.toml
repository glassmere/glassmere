[package]
name = "rust-gui-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
serde = ["dep:serde"]
# Regular expressions in the editor's find bar. Without it a search that asks
# for one reports that the feature is off.
regex = ["dep:regex"]

[dependencies]
serde = { workspace = true, optional = true }
regex = { version = "1.11", optional = true }
rust-gui-scene.workspace = true
bitflags.workspace = true
tracing.workspace = true
taffy.workspace = true
unicode-segmentation.workspace = true
ropey.workspace = true

# The workspace's lints, except that `unsafe_code` is `deny` here and `forbid`
# in `lib.rs`: the allocation test needs a global allocator of its own.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
