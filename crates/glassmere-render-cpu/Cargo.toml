tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
glassmere-core.workspace = true
glassmere-render-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true

[lints]
workspace = true
