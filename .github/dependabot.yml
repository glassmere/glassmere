version: 2
updates:
  # The patch release takes patch updates only; anything that can need code changes goes to the next minor release.
  # Retarget both when a release branch is cut or merged (see CONTRIBUTING.md).
  - package-ecosystem: cargo
    directory: /
    target-branch: release/v0.1.3
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    target-branch: release/v0.2.0
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/v0.2.0
    schedule:
      interval: monthly
    ignore:
      # The MSRV pin, not a version to keep current.
      - dependency-name: dtolnay/rust-toolchain
