name: Rust

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEV_PACKAGES: >-
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
    libx11-dev libxcursor-dev libxi-dev libxrandr-dev

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # Windowing and fonts. The `platform` feature needs no system library
      # on Linux: dialogs go through the desktop portal, and notifications
      # and the tray icon over D-Bus.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEV_PACKAGES fonts-dejavu-core xvfb xauth mesa-vulkan-drivers

      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p glassmere --no-default-features --locked

      # A real window on every platform, not only a build of one. Linux has
      # no display in CI, so Xvfb provides one and the CPU renderer paints
      # into it; the point is that the whole host path runs.
      - name: Windowed smoke run
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --example counter --locked -- --smoke
        env:
          GLASSMERE_RENDERER: cpu

      - name: Windowed smoke run
        if: runner.os != 'Linux'
        run: cargo run --example counter --locked -- --smoke

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEV_PACKAGES
      - run: cargo doc --workspace --all-features --no-deps --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Must match rust-version in Cargo.toml's [workspace.package].
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEV_PACKAGES
      - run: cargo check --workspace --all-features --locked
