name: Rust
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Windowing, fonts, and the desktop integration behind the `platform`
      # feature: a tray icon needs GTK and the app indicator on Linux.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev fonts-dejavu-core libgtk-3-dev \
            libayatana-appindicator3-dev libdbus-1-dev xvfb mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p rust-gui --no-default-features --locked
      # A real window on every platform, not only a build of one. Linux has
      # no display in CI, so Xvfb provides one and the CPU renderer paints
      # into it; the point is that the whole host path runs.
      - name: Windowed smoke run
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run -p rust-gui --example counter --locked -- --smoke
        env:
          RUST_GUI_RENDERER: cpu
      - name: Windowed smoke run
        if: runner.os != 'Linux'
        run: cargo run -p rust-gui --example counter --locked -- --smoke
